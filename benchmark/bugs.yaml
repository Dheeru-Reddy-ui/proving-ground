# Seeded-bug catalog. EVALUATION MATERIAL: never put this file, a bug ID or a flag name into an
# LLM prompt (CLAUDE.md rule 3). Hook points: game/HOOKS.md.
#
# The split is not hand-picked: pg_core.catalog.stratified_split draws it from split_seed, the
# hash of the commit that added specs/ (a60b9d2), and `pg bugs check` fails if the `split`
# fields differ from that draw. Holdout bugs are used only for final measurement (Phase 4);
# they are frozen in benchmark/HOLDOUT_FREEZE.md.
#
# pages: the pg_sdk pages a test must touch to see the bug (pg_core.pages). G3 runs a test
# against a dev bug only if the test touches one of them. `main_menu` is never listed: every
# test navigates through it, so it would make the filter useless.
