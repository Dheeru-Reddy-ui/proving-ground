[project]
name = "proving-ground"
version = "0.1.0"
description = "A trust layer for AI-generated game tests: a generated test enters the suite only after it runs, is deterministic and catches seeded bugs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dheeru Reddy" }]
dependencies = [
    "alembic>=1.20.0",
    "alttester-driver==2.3.2",
    "defusedxml>=0.7.1",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
]

[project.scripts]
pg = "pg_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "pg_core",
  "pg_sdk",
  "pg_generator",
  "pg_runner",
  "pg_agent",
  "pg_api",
  "pg_worker",
  "pg_dashboard",
  "pg_cli",
  "pg_db",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "C4",   # comprehensions
  "RET",  # return statements
  "PTH",  # pathlib over os.path
  "ARG",  # unused arguments
  "PT",   # pytest style
  "S",    # bandit (security)
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # assert is how pytest checks things
  "ARG",   # fakes keep the real signatures, so some arguments go unused
]
"tests/unit/test_gate_static.py" = [
  "E501",  # one adversarial sample per table row reads better unwrapped
]
"tests/integration/test_db.py" = [
  "E501",  # long table-name sets read better on one line
]
"tests/unit/test_classify.py" = [
  "E501",  # one observation per table row reads better unwrapped
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The AltTester driver ships without type information; pg_sdk wraps it behind a typed adapter.
module = ["alttester", "alttester.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
markers = [
  "device: needs the phone and AltTester Desktop; never runs in CI",
]
filterwarnings = [
  # pure-python-adb (a dependency of the AltTester driver) has invalid escapes in its regexes
  "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
source = ["pg_core"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]
