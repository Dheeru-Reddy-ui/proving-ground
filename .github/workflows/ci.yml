name: ci

# Lint, types and unit tests only. Device tests never run in CI: the AltTester free plan
# has no batch mode, and the device host is a Windows PC with a phone attached.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types
        run: uv run mypy pg_core pg_sdk pg_generator pg_runner

      - name: Unit tests
        run: uv run pytest tests/unit -q --cov=pg_core --cov-report=term-missing --cov-fail-under=90
