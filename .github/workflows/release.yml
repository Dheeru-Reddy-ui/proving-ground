name: release

# Two kinds of release (ADR-0010):
# - a code release, tag `v*`: build the image, run migrations against the production database,
#   then call Render's deploy hook (auto-deploy is off, so code never runs ahead of its schema);
# - a game build, a GitHub release tagged `build-*` with a `build.json` asset: post it to the
#   control plane's webhook, signed. The APK itself is never a release asset (public repo, Asset
#   Store content); `pg build register` uploads it to private storage first.
#
# Secrets: DATABASE_URL, RENDER_DEPLOY_HOOK_URL, PG_WEBHOOK_SECRET. Variable: PG_API_URL.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push'
    name: migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Build the image (it must build before anything changes)
        run: docker build -t proving-ground:${{ github.ref_name }} .

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv sync --locked
          uv run alembic upgrade head

      - name: Deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -sf -X POST "$HOOK" -o /dev/null

      - name: Wait until the new version is ready
        env:
          PG_API_URL: ${{ vars.PG_API_URL }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf --max-time 30 "$PG_API_URL/readyz"; then exit 0; fi
            sleep 15
          done
          echo "the service did not become ready" && exit 1

  register-build:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'build-')
    name: register the game build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Fetch build.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --pattern build.json

      - name: Post the signed webhook
        env:
          PG_API_URL: ${{ vars.PG_API_URL }}
          PG_WEBHOOK_SECRET: ${{ secrets.PG_WEBHOOK_SECRET }}
          DELIVERY_ID: gh-${{ github.run_id }}
        run: |
          uv sync --locked --no-default-groups
          uv run --no-sync python ops/release/post_build_webhook.py build.json
